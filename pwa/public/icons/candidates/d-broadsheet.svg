<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dispatch — folded broadsheet with horizon masthead">
  <!-- D: A small folded broadsheet seen straight-on. Coral→gold horizon stripe
       as the masthead; a few hairline rules below stand in for column text. -->
  <rect width="512" height="512" fill="#FBF6EE"/>

  <defs>
    <linearGradient id="dHz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8553C"/>
      <stop offset="1" stop-color="#E5A03A"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <g transform="translate(256 256)">
    <!-- back/shadow page for "folded" depth -->
    <rect x="-128" y="-156" width="248" height="316" rx="6" fill="#F0E6D2"/>
    <!-- main page -->
    <rect x="-140" y="-168" width="248" height="316" rx="6"
          fill="#FFFDF8" stroke="#1B2A4E" stroke-width="3"/>

    <!-- masthead: horizon stripe -->
    <rect x="-122" y="-150" width="212" height="10" rx="5" fill="url(#dHz)"/>

    <!-- tiny "dispatch" wordmark under the masthead -->
    <text x="-16" y="-110" font-family="Georgia, 'Fraunces', serif" font-style="italic"
          font-size="26" fill="#1B2A4E" text-anchor="middle">dispatch</text>

    <!-- subtle small-caps rule -->
    <line x1="-122" y1="-86" x2="90" y2="-86" stroke="#E5DBC9" stroke-width="2"/>

    <!-- two columns of hairline "text" -->
    <g stroke="#7A7468" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <!-- left column -->
      <line x1="-118" y1="-66" x2="-30" y2="-66"/>
      <line x1="-118" y1="-50" x2="-10" y2="-50"/>
      <line x1="-118" y1="-34" x2="-40" y2="-34"/>
      <line x1="-118" y1="-18" x2="-22" y2="-18"/>
      <line x1="-118" y1="-2"  x2="-46" y2="-2"/>
      <line x1="-118" y1="14"  x2="-18" y2="14"/>
      <line x1="-118" y1="30"  x2="-34" y2="30"/>
      <line x1="-118" y1="46"  x2="-26" y2="46"/>
      <line x1="-118" y1="62"  x2="-44" y2="62"/>
      <line x1="-118" y1="78"  x2="-20" y2="78"/>
      <line x1="-118" y1="94"  x2="-38" y2="94"/>
      <line x1="-118" y1="110" x2="-28" y2="110"/>
      <line x1="-118" y1="126" x2="-50" y2="126"/>
      <!-- right column -->
      <line x1="6"  y1="-66" x2="86" y2="-66"/>
      <line x1="6"  y1="-50" x2="78" y2="-50"/>
      <line x1="6"  y1="-34" x2="88" y2="-34"/>
      <line x1="6"  y1="-18" x2="70" y2="-18"/>
      <line x1="6"  y1="-2"  x2="86" y2="-2"/>
      <line x1="6"  y1="14"  x2="74" y2="14"/>
      <line x1="6"  y1="30"  x2="88" y2="30"/>
      <line x1="6"  y1="46"  x2="64" y2="46"/>
      <line x1="6"  y1="62"  x2="86" y2="62"/>
      <line x1="6"  y1="78"  x2="72" y2="78"/>
      <line x1="6"  y1="94"  x2="84" y2="94"/>
      <line x1="6"  y1="110" x2="66" y2="110"/>
      <line x1="6"  y1="126" x2="86" y2="126"/>
    </g>

    <!-- coral horizon edge bar on the left, echoing the feed-item motif -->
    <rect x="-140" y="-60" width="3" height="180" fill="#E8553C"/>
  </g>
</svg>
