name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to read
               the diff. Read surrounding code with `gh` or local files as
               needed.
            2. Evaluate the change for:
               - Correctness, bugs, likely regressions
               - Security (injection, auth, secrets, unsafe deserialization)
               - Repo conventions from CLAUDE.md: AWS-only deployment (no
                 Pi/SSH/systemd path), storage through `digest.store.Store`,
                 Python deps via pyproject + uv.lock
               - Test coverage for new behavior
            3. Post the review by running:
               `gh pr review ${{ github.event.pull_request.number }} --comment --body-file <file>`
               where <file> contains a concise markdown summary (findings
               grouped by severity, file:line references). If there are no
               material issues, post a short "LGTM — no blocking issues"
               comment so it is visible the review ran.

            Be concise. Skip nits unless they materially affect readability
            or correctness.
          claude_args: '--allowed-tools Bash(gh:*),Bash(git:*),Read,Grep,Glob'
