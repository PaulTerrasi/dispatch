name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record start time
        id: started
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Claude code review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(mktemp:*),Read,Grep,Glob,Write"'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to read
               the diff. Read surrounding code with `gh` or local files as
               needed.
            2. Evaluate the change for:
               - Correctness, bugs, likely regressions
               - Security (injection, auth, secrets, unsafe deserialization)
               - Repo conventions from CLAUDE.md: AWS-only deployment (no
                 Pi/SSH/systemd path), storage through `digest.store.Store`,
                 Python deps via pyproject + uv.lock
               - Test coverage for new behavior
            3. Post the review as a SINGLE GitHub review with INLINE comments
               (default behavior — not a plain top-level comment). Build a
               JSON payload and submit it with the reviews API:

                 ```
                 cat > /tmp/review.json <<'JSON'
                 {
                   "body": "<concise markdown summary grouped by severity>",
                   "event": "COMMENT",
                   "comments": [
                     {"path": "path/to/file.py", "line": 42, "side": "RIGHT",
                      "body": "<finding tied to this line>"},
                     {"path": "path/to/other.py", "start_line": 10,
                      "start_side": "RIGHT", "line": 15, "side": "RIGHT",
                      "body": "<finding spanning a range>"}
                   ]
                 }
                 JSON
                 gh api -X POST \
                   repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
                   --input /tmp/review.json
                 ```

               Rules for inline comments:
               - `path` must match a file in the PR diff exactly.
               - `line` must be a line that appears in the diff hunk on the
                 chosen `side` (`RIGHT` for added/context lines on the new
                 file, `LEFT` for removed lines on the old file). Posting on
                 a line outside the diff will fail the whole review — re-read
                 the diff hunks if unsure.
               - Anchor every finding to the specific line(s) it concerns.
                 Put only the cross-cutting summary in the top-level `body`.
               - If there are no material issues, submit the review with
                 `"comments": []` and a short body like
                 `"LGTM — no blocking issues"` so it is visible the review ran.

               If the `gh api` call fails (e.g. invalid line position), read
               the error, fix the offending comment entry, and retry the
               same call. Do NOT fall back to `gh pr review --comment`; the
               inline review is the required output.

            Be concise. Skip nits unless they materially affect readability
            or correctness.

      - name: Verify Claude posted something
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          STARTED: ${{ steps.started.outputs.ts }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Count reviews + issue comments created at/after STARTED, by anyone
          # other than the PR author. This catches reviews Claude posted and
          # also surface comments.
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.submitted_at >= \"$STARTED\")] | length")
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" \
            --jq "[.[] | select(.created_at >= \"$STARTED\")] | length")
          comments=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.created_at >= \"$STARTED\") | select(.user.login != \"coderabbitai[bot]\")] | length")
          echo "New reviews since $STARTED: $reviews"
          echo "New inline review comments since $STARTED: $inline"
          echo "New issue comments since $STARTED: $comments"
          if [ "$reviews" -gt 0 ] || [ "$inline" -gt 0 ] || [ "$comments" -gt 0 ]; then
            echo "Claude posted output — verification passed."
            exit 0
          fi
          echo "No output from Claude detected — posting fallback comment."
          body="Claude PR review ran but produced no visible output (outcome: \`$CLAUDE_OUTCOME\`). See [workflow run]($RUN_URL)."
          gh pr comment "$PR" --repo "$REPO" --body "$body"
