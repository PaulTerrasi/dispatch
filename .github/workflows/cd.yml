name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # tag + release
  id-token: write       # AWS OIDC
  pull-requests: read

jobs:
  ci:
    name: Run CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to AWS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.url.outputs.live_url }}
    outputs:
      live_url: ${{ steps.url.outputs.live_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python deps
        run: uv sync --all-extras

      - name: Install PWA deps
        working-directory: pwa
        run: npm ci

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy infrastructure
        run: make deploy-infra

      - name: Deploy PWA
        run: make deploy-pwa

      - name: Resolve live CloudFront URL
        id: url
        run: |
          live_url=$(make url)
          echo "live_url=$live_url" >> "$GITHUB_OUTPUT"
          echo "Live URL: $live_url"

  e2e:
    name: E2E smoke against live
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA deps
        working-directory: pwa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: pwa
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run live E2E smoke
        run: make test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pwa/playwright-report
          if-no-files-found: ignore

  release:
    name: Tag and GitHub Release
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          base=$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v${base}.${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $tag"

      - name: Create tag (idempotent)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping create+push (re-run safe)."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          prev=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "${prev}..${TAG}"
            else
              git log --pretty=format:'- %s (%h)' -n 20
            fi
          } > NOTES.md
          echo "file=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create (re-run safe)."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file NOTES.md \
              --target "${{ github.sha }}"
          fi
