name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  pwa:
    name: PWA lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prettier check
        run: npx prettier --check 'src/**/*.{ts,tsx,css,html}'

      - name: ESLint
        run: npx eslint 'src/**/*.{ts,tsx}' --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload PWA coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-coverage
          path: pwa/coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-extras

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Synth (no AWS creds required)
        working-directory: infra
        run: cdk synth --quiet
