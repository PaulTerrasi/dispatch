[project]
name = "dispatch"
version = "0.1.0"
description = "Personal iPhone PWA: a Claude-curated morning digest"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "claude-agent-sdk>=0.1.71,<0.2",
    "feedparser>=6.0.11",
    "youtube-transcript-api>=0.6.2",
    "readability-lxml>=0.8.1",
    "lxml[html_clean]>=5.3",
    "httpx>=0.28",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.34",
    # CDK is a dev-only dep — only needed for `cd infra && cdk synth/deploy`.
    # infra/cdk.json runs `uv run python app.py`, so these must be in the main venv.
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "digest"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["infra/cdk.out", ".venv", ".venv.nosync", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes/pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # pathlib over os.path
]
ignore = [
    "E501",   # line length — formatter handles it
    "SIM105", # contextlib.suppress is overkill for one-line try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["server", "digest"]
plugins = []

[[tool.mypy.overrides]]
module = ["feedparser.*", "readability.*", "youtube_transcript_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["server", "digest"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # One-liner Protocol/ABC method stubs — no executable body. Both
    # patterns require ≥4 spaces of indentation so a module-level
    # placeholder like `def todo() -> X: ...` (or a stray bare `...`) is
    # NOT silently excluded — that would defeat the 100% gate. All real
    # abstract stubs in this codebase live inside a class (Protocol or
    # ABC), which guarantees the indentation.
    "^ {4,}\\.\\.\\.$",
    "^ {4,}def .*\\) -> .*: \\.\\.\\.$",
]
partial_branches = [
    "pragma: no branch",
    "if TYPE_CHECKING:",
]
